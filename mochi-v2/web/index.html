<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mochi Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <header class="side-head">
      <div class="brand"><span class="logo">M</span><span>Mochi</span></div>
      <button class="icon-btn" id="newGroup" title="New group" aria-label="New group">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="filter" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
    </div>
    <nav id="list" class="list"></nav>
    <button class="me" id="meCard" title="Edit profile">
      <span id="meAv"></span>
      <span class="me-text"><b id="meName">…</b><small><i class="dot" id="dot"></i><span id="status">connecting…</span></small></span>
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
  </aside>

  <main class="main">
    <div id="empty" class="empty">
      <div class="empty-card">
        <span class="logo big">M</span>
        <h2>Welcome to Mochi</h2>
        <p class="mut">Pick a conversation from the sidebar, or start with one of these.</p>
        <div class="quick">
          <button data-go="hi"><b>Open the lobby</b><small>Public chat with everyone online</small></button>
          <button data-go="group"><b>Create a group</b><small>Invite people who are online</small></button>
          <button data-go="pic"><b>Set up your profile</b><small>Photo, display name and status</small></button>
        </div>
      </div>
    </div>

    <section id="chat" class="chat" hidden>
      <header class="chat-head">
        <button id="back" class="icon-btn back" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="hAv"></span>
        <div class="head-text"><h2 id="hName"></h2><p id="hSub"></p></div>
        <button class="btn ghost sm" id="addBtn" hidden>Add member</button>
      </header>
      <div id="msgs" class="msgs"></div>
      <div id="typing" class="typing"></div>
      <form id="composer" class="composer">
        <input id="text" maxlength="1000" autocomplete="off" placeholder="Write a message…" aria-label="Message">
        <button class="send" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </form>
    </section>
  </main>
</div>

<dialog id="login" class="modal">
  <form id="loginForm">
    <div class="login-brand">
      <span class="logo">M</span>
      <div><h3>Sign in to Mochi</h3><p class="mut">Pick a username to join the chat.</p></div>
    </div>
    <label><span>Username</span><input id="user" maxlength="20" required autocomplete="username" placeholder="e.g. ali"></label>
    <label><span>Display name <em>(optional)</em></span><input id="disp" maxlength="32" placeholder="Shown to others"></label>
    <p class="err" id="loginErr"></p>
    <button class="btn full">Continue</button>
  </form>
</dialog>

<dialog id="profile" class="modal">
  <form id="profileForm">
    <div class="modal-head">
      <h3>Your profile</h3>
      <button type="button" class="icon-btn" data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="pic">
      <button type="button" id="pAv" aria-label="Change photo"></button>
      <div class="pic-acts">
        <button type="button" class="btn ghost sm" id="pPick">Upload photo</button>
        <button type="button" class="btn ghost sm" id="pClear">Remove</button>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <label><span>Display name</span><input id="pName" maxlength="32"></label>
    <label><span>Status</span><textarea id="pBio" maxlength="160" rows="2" placeholder="What are you up to?"></textarea></label>
    <div class="acts">
      <button type="button" class="btn ghost danger" id="signOut">Sign out</button>
      <span class="grow"></span>
      <button type="button" class="btn ghost" data-x>Cancel</button>
      <button class="btn">Save</button>
    </div>
  </form>
</dialog>

<dialog id="groupDlg" class="modal">
  <form id="groupForm">
    <div class="modal-head">
      <h3>New group</h3>
      <button type="button" class="icon-btn" data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <label><span>Group name</span><input id="gName" maxlength="40" required placeholder="e.g. CS-327 project"></label>
    <div class="acts"><button type="button" class="btn ghost" data-x>Cancel</button><button class="btn">Create</button></div>
  </form>
</dialog>

<dialog id="addDlg" class="modal">
  <div class="dbody">
    <div class="modal-head">
      <h3>Add member</h3>
      <button type="button" class="icon-btn" data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div id="pick"></div>
  </div>
</dialog>

<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
